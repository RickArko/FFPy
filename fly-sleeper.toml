app = "ffpy-sleeper"
primary_region = "iad"

[vm]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "ffpy-db migrate && ffpy-db load-adp --season 2026"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  DATABASE_PATH = "/data/ffpy.db"
  DATABASE_TYPE = "sqlite"
  WEB_AUTH_ENABLED = "true"
  PUBLIC_APP_URL = "https://ffpy-sleeper.fly.dev"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "ffpy-sleeper"

[[mounts]]
  source = "ffpy_sleeper_data"
  destination = "/data"
